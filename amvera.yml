meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  persistenceMount: /data
  command: uvicorn app.main:app --reload --port 8000
  containerPort: 80
  russianTrustedCa: false
  singleton: true
  zeroDowntime: false
