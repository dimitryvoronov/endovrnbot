meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  persistenceMount: /data
  # --host 0.0.0.0 is required (default 127.0.0.1 is unreachable -> 503).
  # The --port here MUST equal containerPort. No --reload in production.
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  containerPort: 8000
  russianTrustedCa: false
  singleton: true
  zeroDowntime: false
